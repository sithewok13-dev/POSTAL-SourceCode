name: iOS

# Builds POSTAL.app for iPhone and iPad (unsigned .ipa; sideload it, then copy the
# res folder of your own POSTAL: Classic and Uncut into Files > On My iPhone > POSTAL).
# Pushes to "ios" update the ios-latest release; pushes to "ios-dev" only build
# (a compile check for work in progress). A manual run with "release" publishes
# that tag:
#   gh workflow run ios.yml --ref ios -f release=ios-v0.1
# It stops before building unless ios/RELEASE_NOTES.md has the exact line
# "### What's in <tag>", creates the tag at the commit it built, attaches only
# the .ipa files in RELEASE_IPAS, and then adds the release to the AltStore /
# SideStore source (ios/altstore-source.json on branch ios; see the last step).
# Every run checks that the .ipa holds no game data.

on:
  push:
    branches: [ "ios", "ios-dev" ]
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty to update ios-latest as usual.
        required: false
        default: ''

concurrency:
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  IOS_MIN: "15.0"
  SDL_TAG: release-2.30.8
  RELEASE_TAG: ${{ inputs.release }}
  RELEASE_IPAS: postal-ios.ipa
  RELEASE_TITLE: "POSTAL for iOS"

permissions:
  contents: read

jobs:
  build:
    name: POSTAL
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Select newest Xcode
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's .ipa and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Host tools
      run: brew install ninja || true

    - name: Restore iOS dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: deps
        key: ios-deps-${{ env.SDL_TAG }}-${{ env.IOS_MIN }}-v1

    - name: Build SDL2 for iOS
      if: steps.deps.outputs.cache-hit != 'true'
      run: ios/ci_run.sh "iOS dependencies" ios/build_deps.sh "$PWD/deps"

    - name: Save iOS dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: deps
        key: ${{ steps.deps.outputs.cache-primary-key }}

    - name: Configure
      run: |
        ios/ci_run.sh "Configure" cmake -S ios -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN \
          -DCMAKE_BUILD_TYPE=Release \
          -DSDL2_ROOT=$PWD/deps \
          -DPOSTAL_IOS_BUILD_NUMBER=${{ github.run_number }}

    - name: Build
      run: ios/ci_run.sh "Build" cmake --build build -- -k 0

    - name: Package .ipa
      run: |
        set -e
        APP=$(find build -maxdepth 2 -name "*.app" -type d | head -1)
        echo "App bundle: $APP"
        ls -la "$APP"
        plutil -lint "$APP/Info.plist"
        test -f "$APP/POSTAL.INI"
        codesign --force --sign - --timestamp=none "$APP"
        mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/
        (cd ipa && zip -qry ../postal-ios.ipa Payload)
        ls -la *.ipa

    # No game data in the .ipa, ever. Only these may be in the app: the game
    # (POSTAL), Info.plist, PkgInfo, the icons, _CodeSignature/ and the app's
    # own POSTAL.INI (ios/POSTAL.INI, byte for byte). Anything else fails the
    # run, and so does any of the game's own files (res/, .sak, levels,
    # sounds, pictures, saves) anywhere in it.
    - name: Check the .ipa has no game data
      run: |
        set -e
        APPDIR='Payload/POSTAL\.app'
        ENTRIES=$(unzip -Z1 postal-ios.ipa | grep -v '/$')
        BAD=$(echo "$ENTRIES" | grep -vE "^${APPDIR}/(POSTAL|Info\.plist|PkgInfo|POSTAL\.INI|AppIcon[^/]*\.png|_CodeSignature/[^/]+)$" || true)
        GAME=$(echo "$ENTRIES" | grep -iE '(^|/)res/|\.(sak|rlm|hoo|wav|mp3|ogg|bmp|fnt|anm|sav|gme|mpl|rsp|snd)$' || true)
        mkdir -p ini-check
        unzip -o -q postal-ios.ipa 'Payload/POSTAL.app/POSTAL.INI' -d ini-check
        INI=$(cmp -s ini-check/Payload/POSTAL.app/POSTAL.INI ios/POSTAL.INI || echo "POSTAL.INI differs from ios/POSTAL.INI")
        if [ -n "$BAD$GAME$INI" ]; then
          [ -n "$BAD" ] && echo "::error::Files in the .ipa that aren't allowed:" && echo "$BAD"
          [ -n "$GAME" ] && echo "::error::Game files in the .ipa:" && echo "$GAME"
          [ -n "$INI" ] && echo "::error::$INI"
          exit 1
        fi
        echo "No game data: $(echo "$ENTRIES" | wc -l | tr -d ' ') files, all allowed."

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: postal-ios
        path: postal-ios.ipa

  release:
    name: ${{ inputs.release != '' && format('Publish release {0}', inputs.release) || 'Publish to "iOS latest" release' }}
    needs: build
    if: github.ref == 'refs/heads/ios' || inputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Release runs only: the notes from the run's commit, for the release text.
    # Kept first, as checkout empties the folder it checks out into.
    - name: Get release notes
      if: env.RELEASE_TAG != ''
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          ios/RELEASE_NOTES.md
          ios/update_altstore_source.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: actions/download-artifact@v4
      with:
        path: out
        merge-multiple: true

    # Pushes and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish to "ios-latest" release
      if: env.RELEASE_TAG == ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ios-latest
        name: iOS latest build
        prerelease: true
        make_latest: false
        body: |
          Development builds, rebuilt after every push to the `ios` branch (run ${{ github.run_number }}, commit ${{ github.sha }}). They may not have been tried yet. For the latest release and how to install it, see ${{ github.server_url }}/${{ github.repository }}/releases/latest
          Sideload postal-ios.ipa, then copy the res folder of your own POSTAL: Classic and Uncut (GOG) into Files > On My iPhone > POSTAL.
        files: out/*.ipa

    # Release runs: only the games in RELEASE_IPAS, the title and whether it's
    # a prerelease (a '-' in the version, after the "ios-").
    - name: Prepare release
      id: rel
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" ios/RELEASE_NOTES.md; then
          echo "::error file=ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        mkdir release
        for ipa in $RELEASE_IPAS; do
          if [ ! -f "out/$ipa" ]; then
            echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
            exit 1
          fi
          cp "out/$ipa" release/
        done
        ls -la release
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) PRERELEASE=true; LATEST=false ;;
          *) PRERELEASE=false; LATEST=true ;;
        esac
        echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
        {
          echo "name=$RELEASE_TITLE $VERSION"
          echo "prerelease=$PRERELEASE"
          echo "latest=$LATEST"
        } >> "$GITHUB_OUTPUT"

    - name: Publish release for the tag
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        # Creates the tag at the commit this run built (left out, GitHub would
        # put a new tag on the default branch, main)
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.rel.outputs.name }}
        body_path: ios/RELEASE_NOTES.md
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        files: release/*.ipa
        fail_on_unmatched_files: true

    # The AltStore / SideStore source (ios/altstore-source.json, read from
    # branch ios by the README's raw link) gets the release just published:
    # its size, SHA-256, date, download link and the "What's in" list as a
    # summary (ios/update_altstore_source.py); the ios-latest entry the source
    # started with goes. Committed to ios by GITHUB_TOKEN, marked [skip ci]
    # (a GITHUB_TOKEN push starts no run anyway), so ios-latest isn't rebuilt.
    # continue-on-error: if this fails, the release (already out) still counts.
    - name: Add the release to the AltStore / SideStore source
      if: env.RELEASE_TAG != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ios
      run: |
        set -euo pipefail
        trap 'echo "::warning::The AltStore / SideStore source was not updated for ${RELEASE_TAG}. The release itself is published; add it to ios/altstore-source.json by hand."' ERR
        SRC="$RUNNER_TEMP/altstore-source"
        rm -rf "$SRC"
        git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SRC"
        git -C "$SRC" config user.name "github-actions[bot]"
        git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3; do
          # The script and the notes come from the commit just built; the
          # source file from the newest ios branch
          ARGS=()
          for ipa in $RELEASE_IPAS; do ARGS+=(--ipa "release/$ipa"); done
          python3 -I ios/update_altstore_source.py \
            --source "$SRC/ios/altstore-source.json" \
            --tag "$RELEASE_TAG" --notes ios/RELEASE_NOTES.md "${ARGS[@]}"
          if git -C "$SRC" diff --quiet; then
            echo "The source already has ${RELEASE_TAG}"
            break
          fi
          git -C "$SRC" commit --quiet -am "iOS: add ${RELEASE_TAG} to the AltStore / SideStore source [skip ci]"
          if git -C "$SRC" push --quiet origin "HEAD:${SOURCE_BRANCH}"; then
            echo "Added ${RELEASE_TAG} to the source on ${SOURCE_BRANCH}"
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::warning::Couldn't push the AltStore / SideStore source update after 3 tries."
            exit 1
          fi
          # Someone pushed to ios meanwhile: start again from the newest
          git -C "$SRC" fetch --quiet --depth 1 origin "$SOURCE_BRANCH"
          git -C "$SRC" reset --quiet --hard FETCH_HEAD
        done
